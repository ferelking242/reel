name: reel
description: Reel — UI TikTok-style pour Watchtower. Fusionne dans watchtower/lib/ui/tiktok/.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management — mêmes versions que watchtower ────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod:          ^3.1.0
  hooks_riverpod:    ^3.0.0
  flutter_hooks:     ^0.21.0

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^17.2.0

  # ── Watchtower SDK — client officiel (retry, auth, modèles typés) ────────────
  watchtower_client:
    git:
      url: https://github.com/ferelking242/watchtower-sdk-dart.git
      ref: main

  # ── Network ──────────────────────────────────────────────────────────────────
  http: ^1.6.0

  # ── Storage — même stack que watchtower ──────────────────────────────────────
  hive:         ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.5

  # ── Vidéo — mêmes versions que watchtower, pour une résolution unique ───────
  media_kit:            1.2.2
  media_kit_video:      2.0.0
  media_kit_libs_video: 1.0.7

  # ── UI ───────────────────────────────────────────────────────────────────────
  flex_color_scheme:    ^8.3.1
  cached_network_image: ^3.3.1
  skeletonizer:         ^2.1.0+1
  shimmer:              ^3.0.0
  marquee:              ^2.2.3
  cupertino_icons:      ^1.0.9

  # ── Utils ────────────────────────────────────────────────────────────────────
  path_provider:    ^2.1.5
  package_info_plus: ^9.0.1
  intl:             ^0.20.2
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # build_runner et générateurs retirés : pas de codegen actif dans watchtower-real.
  # Les ajouter uniquement quand on utilisera @riverpod ou @IsarCollection.

flutter:
  uses-material-design: true
  assets:
    - assets/contract.json

  # TikTok Sans — police officielle de TikTok, sous SIL Open Font License 1.1
  # (voir assets/fonts/OFL.txt). Instances statiques générées depuis la
  # variable font pour que Flutter sélectionne les graisses correctement.
  fonts:
    - family: TikTokSans
      fonts:
        - asset: assets/fonts/TikTokSans-Regular.otf
          weight: 400
        - asset: assets/fonts/TikTokSans-Medium.otf
          weight: 500
        - asset: assets/fonts/TikTokSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/TikTokSans-Bold.otf
          weight: 700
